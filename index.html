<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Redirect</title>
</head>
<body>
  <script>
    (function () {
      // Support both:
      // 1) /redirectSim/?redirect_uri=...
      // 2) /#/redirectSim?redirect_uri=...   (common on GitHub Pages/SPAs)
      function getParams() {
        const search = window.location.search || "";

        // hash can be: "#/redirectSim?x=1&y=2" OR "#?x=1&y=2"
        const hash = window.location.hash || "";
        const hashQueryIndex = hash.indexOf("?");
        const hashQuery = hashQueryIndex >= 0 ? hash.slice(hashQueryIndex) : "";

        // Prefer search, fall back to hash query
        const raw = search && search.length > 1 ? search : hashQuery;

        return new URLSearchParams(raw);
      }

      const params = getParams();

      const redirectUriRaw = params.get("redirect_uri");
      const state = params.get("state") || "";

      if (!redirectUriRaw) {
        document.body.textContent = "Missing redirect_uri query parameter.";
        console.error("Missing redirect_uri.", {
          href: window.location.href,
          search: window.location.search,
          hash: window.location.hash
        });
        return;
      }

      let redirectUri;
      try {
        redirectUri = new URL(redirectUriRaw);
      } catch (e) {
        document.body.textContent = "Invalid redirect_uri query parameter.";
        console.error("Invalid redirect_uri:", redirectUriRaw, "Error:", e);
        return;
      }

      const host = redirectUri.hostname;
      const suffix = ".nordicapigateway.com";

      if (!host.toLowerCase().endsWith(suffix)) {
        document.body.textContent = "redirect_uri must be on *.nordicapigateway.com.";
        console.error("redirect_uri host not allowed:", { redirectUri: redirectUriRaw, parsedHost: host });
        return;
      }

      const subdomainPart = host.slice(0, -suffix.length);
      if (!subdomainPart) {
        document.body.textContent = "redirect_uri must include a subdomain (e.g. auth.nordicapigateway.com).";
        console.error("redirect_uri missing subdomain:", { redirectUri: redirectUriRaw, parsedHost: host });
        return;
      }

      const target = new URL(`https://${subdomainPart}${suffix}/stage-routing/callback`);
      target.searchParams.set("code", "123");
      if (state) target.searchParams.set("state", state);

      window.location.replace(target.toString());
    })();
  </script>
</body>
</html>
