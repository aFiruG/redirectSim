<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Redirect</title>
</head>
<body>
  <script>
    (function () {
      // HOTFIX:
      // Some environments (e.g. GitHub Pages / certain redirects) may drop the query string,
      // which makes redirect_uri unavailable. In that case we default to a known safe host.
      const DEFAULT_HOST = "auth.nordicapigateway.com";

      function getParams() {
        const search = window.location.search || "";

        // hash can be: "#/redirectSim?x=1&y=2" OR "#?x=1&y=2"
        const hash = window.location.hash || "";
        const hashQueryIndex = hash.indexOf("?");
        const hashQuery = hashQueryIndex >= 0 ? hash.slice(hashQueryIndex) : "";

        // Prefer search, fall back to hash query
        const raw = search && search.length > 1 ? search : hashQuery;
        return new URLSearchParams(raw);
      }

      const params = getParams();

      const redirectUriRaw = params.get("redirect_uri");
      const state = params.get("state") || "";

      let hostToUse = DEFAULT_HOST;

      if (redirectUriRaw) {
        try {
          const redirectUri = new URL(redirectUriRaw);

          // More permissive: accept any subdomain depth as long as it ends with nordicapigateway.com
          const host = redirectUri.hostname;
          const suffix = ".nordicapigateway.com";

          if (host && host.toLowerCase().endsWith(suffix)) {
            hostToUse = host; // keep exact host from redirect_uri (e.g. auth.nordicapigateway.com)
          } else {
            console.warn(
              "HOTFIX: redirect_uri host not allowed; defaulting to DEFAULT_HOST.",
              { redirect_uri: redirectUriRaw, parsedHost: host, defaultHost: DEFAULT_HOST }
            );
          }
        } catch (e) {
          console.warn(
            "HOTFIX: invalid redirect_uri; defaulting to DEFAULT_HOST.",
            { redirect_uri: redirectUriRaw, defaultHost: DEFAULT_HOST, error: String(e) }
          );
        }
      } else {
        console.warn(
          "HOTFIX: missing redirect_uri; defaulting to DEFAULT_HOST.",
          { href: window.location.href, defaultHost: DEFAULT_HOST }
        );
      }

      const target = new URL(`https://${hostToUse}/stage-routing/callback`);
      target.searchParams.set("code", "123");
      if (state) target.searchParams.set("state", state);

      window.location.replace(target.toString());
    })();
  </script>
</body>
</html>
