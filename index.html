<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Redirect</title>
</head>
<body>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);

      // Provided by the caller (URL-encoded)
      const redirectUriRaw = params.get("redirect_uri");
      const state = params.get("state") || "";

      if (!redirectUriRaw) {
        document.body.textContent = "Missing redirect_uri query parameter.";
        console.error("Missing redirect_uri. Full URL:", window.location.href);
        return;
      }

      let redirectUri;
      try {
        redirectUri = new URL(redirectUriRaw);
      } catch (e) {
        document.body.textContent = "Invalid redirect_uri query parameter.";
        console.error("Invalid redirect_uri:", redirectUriRaw, "Error:", e);
        return;
      }

      // More permissive:
      // - allow any path/query on the redirect_uri
      // - only require that the host ends with ".nordicapigateway.com"
      // - allow multi-level subdomains (e.g. "auth", "app-test", "foo.bar")
      const host = redirectUri.hostname; // excludes port
      const suffix = ".nordicapigateway.com";

      if (!host.toLowerCase().endsWith(suffix)) {
        document.body.textContent =
          "redirect_uri must be on *.nordicapigateway.com (e.g. https://auth.nordicapigateway.com/...).";
        console.error("redirect_uri host not allowed:", { redirectUri: redirectUriRaw, parsedHost: host });
        return;
      }

      // Keep the exact subdomain part (everything before ".nordicapigateway.com")
      const subdomainPart = host.slice(0, -suffix.length);

      // If redirect_uri is exactly "https://nordicapigateway.com/..." then subdomainPart will be ""
      if (!subdomainPart) {
        document.body.textContent =
          "redirect_uri must include a subdomain, e.g. https://auth.nordicapigateway.com/...";
        console.error("redirect_uri missing subdomain:", { redirectUri: redirectUriRaw, parsedHost: host });
        return;
      }

      // Build target URL (fixed callback path)
      const target = new URL(`https://${subdomainPart}${suffix}/stage-routing/callback`);
      target.searchParams.set("code", "123");
      if (state) target.searchParams.set("state", state);

      window.location.replace(target.toString());
    })();
  </script>
</body>
</html>
